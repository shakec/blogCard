<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div id="card">
    <div id="content">
      <div class="blogImg">
        <img src="preview.jpg" alt="Yellow and black abstract vector graphic with programming visual references">
      </div>
      <div class="label">Learning</div>
      <div id="text">
        <p class="published">Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p class="summary">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>
      <div id="author">
        <img src="./assets/images/image-avatar.webp" alt="Profile picture of Greg Hopper looking to the left into the distance" class="avatar">
        <p class="name">Greg Hooper</p>
      </div>
    </div>
  </div>

  

  

  

  

  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
